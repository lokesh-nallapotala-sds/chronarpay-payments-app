        <div class={historyMenuItemClass} onclick={navigateToTransactions}>

            icon-name="utility:list"

          <lightning-icon
            icon-name="utility:date_time"

          ></lightning-icon>

            class="menu-item-icon"

          Deposits
        </div> -->

          <lightning-icon
            icon-name="utility:user"
            size="xx-small"

          <lightning-icon
            icon-name="utility:settings"

          ></lightning-icon>
          Configuration
        </div> -->

            <div class="header-actions">

                      display: inline-block;

                      height: 14px;
                      margin-right: 6px;

                <template if:false={isLoadingPaymentMethods}>

            </div>
          </div>

          <template if:true={customerError}>

              {customerError}

          <template if:true={customerSuccess}>

          <section class="customer-panel customer-table-panel">
            <table class="invoice-table customer-table">
              <thead>
                <tr>
                  <!-- <th>Customer</th> -->
                  <!-- <th>Email</th> -->
                  <th>Type</th>
                  <th>Brand</th>
                  <th>Card Number</th>
                  <th>Expiry</th>
                  <th>Status</th>
                  <th>Created</th>
                </tr>
              </thead>
              <tbody>
                <template if:true={isLoadingPaymentMethods}>
                  <tr>
                    <td
                      colspan="7"
                      style="text-align: center; padding: 36px; color: #64748b"
                    >
                      <lightning-spinner
                        alternative-text="Loading payment methods..."
                        size="small"
                        style="position: relative; display: inline-block; width: 18px; height: 18px; margin-right: 8px;"

                    </td>

                <template if:false={isLoadingPaymentMethods}>

                      <tr key={method.id}>

                          <span style="font-weight: 600; color: #0f172a"
                            >{method.customerDisplayName}</span

              <p class="page-subtitle">

              </p>
            </div>
          </div>

                  <tr>
                    <th>Document #</th>
                    <th>Date</th>
                    <th>Account</th>
                    <th>Open</th>
                    <th>Pay</th>
                    <th style="width: 50px; text-align: center"></th>
                  </tr>
                </thead>
                <tbody>
                  <template for:each={selectedInvoices} for:item="inv">
                    <tr key={inv.key}>

                        {inv.billingDocumentNumber}
                      </td>
                      <td>{inv.documentDate}</td>
                      <td>{inv.accountNumber}</td>
                      <td style="font-weight: 600">
                        {inv.currencySymbol}{inv.formattedOpen}
                      </td>
                      <td>
                        <template if:true={inv.isPositiveOpen}>
                          <div class="pay-input-container">
                            <span class="pay-currency-symbol">{inv.currencySymbol}</span>
                            <input
                              type="number"
                              step="0.01"
                              class="pay-amount-input"
                              value={inv.payAmount}
                              data-id={inv.key}
                              oninput={handlePayAmountChange}
                            />
                          </div>

                        <template if:false={inv.isPositiveOpen}>

                          data-id={inv.key}
                          onclick={handleRemoveInvoice}

                  <span style="font-weight: 600">{currencySymbol}{formattedSummaryPayAmount}</span>

                <div class="summary-line-item">

                <div class="summary-line-item bold-total">

                      <template if:true={activeStripeCustomer.isNewCustomer}>

                      <template if:false={activeStripeCustomer.isNewCustomer}>
                        <span class="customer-badge customer-badge-existing">&#10003; Existing Customer</span>
                      </template>
                    </div> -->
                    <div class="customer-banner-body">
                      <div class="customer-detail-row">
                        <span class="customer-detail-label">Account Name</span>
                        <span class="customer-detail-value">{activeStripeCustomer.accountName}</span>
                      </div>
                      <div class="customer-detail-row">
                        <span class="customer-detail-label">Account #</span>
                        <span class="customer-detail-value">{activeStripeCustomer.accountNumber}</span>
                      </div>
                      <template if:true={activeStripeCustomer.salesOrganization}>
                        <div class="customer-detail-row">
                          <span class="customer-detail-label">Sales Organization</span>
                          <span class="customer-detail-value">{activeStripeCustomer.salesOrganization}</span>
                        </div>
                      </template>
                      <!-- <div class="customer-detail-row">
                        <span class="customer-detail-label">Stripe Customer</span>
                        <span class="customer-detail-value customer-id-pill">{activeStripeCustomer.id}</span>
                      </div> -->
                      <template if:true={activeStripeCustomer.email}>
                        <div class="customer-detail-row">
                          <span class="customer-detail-label">Email</span>
                          <span class="customer-detail-value">{activeStripeCustomer.email}</span>
                        </div>
                      </template>
                      <template if:true={activeStripeCustomer.phone}>
                        <div class="customer-detail-row">
                          <span class="customer-detail-label">Phone</span>
                          <span class="customer-detail-value">{activeStripeCustomer.phone}</span>
                        </div>
                      </template>
                      <template if:true={activeCustomerFormattedAddress}>
                        <div class="customer-detail-row">
                          <span class="customer-detail-label">Billing Address</span>
                          <span class="customer-detail-value">{activeCustomerFormattedAddress}</span>
                        </div>
                      </template>
                    </div>
                  </div>
                </template>

                <!-- Payment Method Type Switcher (Segmented Cards) -->
                <div class="payment-form-group" style="margin-top: 18px">
                  <label class="payment-form-label"
                    >Payment Method Option</label
                  >
                  <div class="payment-segment-group">
                    <button
                      type="button"
                      class={savedModeClass}
                      onclick={selectSavedPaymentMode}
                    >
                      <span class="segment-icon">&#128179;</span>
                      <span class="segment-text">Saved Card</span>
                    </button>
                    <button
                      type="button"
                      class={newModeClass}
                      onclick={selectNewPaymentMode}
                    >
                      <span class="segment-icon">&#10024;</span>
                      <span class="segment-text"
                        >New Card (Payment Element)</span
                      >
                    </button>
                  </div>
                </div>

                <!-- Existing Card Selection -->
                <template if:true={isExistingPaymentMode}>
                  <div class="payment-form-group" style="margin-top: 14px">
                    <label class="payment-form-label">Choose Saved Card</label>
                    <template if:true={hasCustomerPaymentMethods}>
                      <select
                        class="payment-form-select"
                        onchange={handlePaymentMethodChange}
                      >
                        <template for:each={paymentMethodOptions} for:item="pm">
                          <option
                            key={pm.value}
                            value={pm.value}
                            selected={pm.selected}
                          >
                            {pm.label}
                          </option>
                        </template>
                      </select>
                    </template>
                    <template if:false={hasCustomerPaymentMethods}>
                      <div class="no-pm-notice">
                        <span>No saved cards found for this customer.</span>
                        <button
                          type="button"
                          class="switch-to-new-link"
                          onclick={selectNewPaymentMode}
                        >
                          Pay with New Card &rarr;
                        </button>
                      </div>
                    </template>
                  </div>
                </template>

                <!-- New Card / Stripe Payment Element -->
                <template if:true={isNewPaymentMode}>
                  <div class="payment-form-group" style="margin-top: 14px">
                    <div class="new-pm-header">
                      <label class="payment-form-label" style="margin: 0">Secure Card Payment</label>
                      <span class="pci-badge">&#128274; 256-Bit SSL Encrypted</span>
                    </div>
                    <div class="stripe-element-container">
                      <template if:true={stripeElementLoading}>
                        <div class="stripe-loading-box">
                          <lightning-spinner
                            alternative-text="Loading secure payment form..."
                            size="small"
                          ></lightning-spinner>
                          <span
                            style="
                              font-size: 12px;
                              color: #64748b;
                              margin-top: 8px;
                            "
                            >Loading Stripe Payment Element...</span>
                        </div>
                      </template>
                      <!-- Stripe mounts its PCI-compliant iframe/UI inside this container. -->
                      <div
                        class="stripe-payment-element"
                        data-stripe-bridge={stripeBridgeId}
                        lwc:dom="manual"
                      ></div>
                    </div>
                    <div class="pci-notice-text">
                      Card information is encrypted and submitted directly to
                      Stripe. Sensitive details never touch Salesforce.
                    </div>
                  </div>
                </template>

                <template if:true={paymentError}>
                  <div
                    class="customer-alert customer-alert-error"
                    style="margin-top: 14px"
                  >
                    {paymentError}
                  </div>
                </template>

                <button
                  class="continue-btn-red"
                  disabled={paymentButtonDisabled}
                  onclick={handleFinalPay}
                >
                  <template if:true={isProcessing}>
                    <lightning-spinner
                      alternative-text="Processing..."
                      size="small"
                      variant="inverse"
                      style="
                        position: relative;
                        display: inline-block;
                        width: 16px;
                        height: 16px;
                        margin-right: 8px;
                      "
                    ></lightning-spinner>
                    Processing Payment...
                  </template>
                  <template if:false={isProcessing}>
                    Pay {currencySymbol}{formattedSummaryTotal}
                  </template>
                </button>
              </div>
            </div>
          </div>
        </template>
      </div>
    </main>
  </div>

  <!-- Payment Status Modal -->
  <template if:true={paymentStatus}>
    <div class="custom-modal-backdrop">
      <template if:true={isPaymentSuccess}>
        <div class="custom-modal success">
          <div class="modal-content">
            <div class="modal-icon-container">
              <lightning-icon
                icon-name="utility:success"
                size="medium"
                variant="success"
              ></lightning-icon>
            </div>
            <h2 class="modal-title">Payment Successful!</h2>
            <p class="modal-description">
              Thank you for your payment. Your invoices have been paid
              successfully.
            </p>
            <button class="modal-btn" onclick={handleDismissPaymentStatus}>
              Done
            </button>
          </div>
        </div>
      </template>
      <template if:true={isPaymentCancel}>
        <div class="custom-modal cancel">
          <div class="modal-content">
            <div class="modal-icon-container">
              <lightning-icon
                icon-name="utility:error"
                size="medium"
                variant="error"
              ></lightning-icon>
            </div>
            <h2 class="modal-title">Payment Cancelled</h2>
            <p class="modal-description">
              The payment process was cancelled or declined. No charges were
              made.
            </p>
            <button class="modal-btn" onclick={handleDismissPaymentStatus}>
              Go Back
            </button>
          </div>
        </div>
      </template>
    </div>
  </template>
